<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Overlapping‑Trees Explorer</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html,body,svg {height:100%;width:100%;margin:0;padding:0;overflow:hidden;font-family:system-ui;}
    #controls{position:fixed;top:8px;left:8px;background:#ffffffcc;border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;backdrop-filter:blur(6px)}
    #legend{display:flex;gap:6px}
    #legend div{width:12px;height:12px;border-radius:2px}
    button{padding:4px 8px;border:none;border-radius:4px;cursor:pointer;box-shadow:0 1px 3px #0003;background:#4f46e5;color:white;font-size:12px}
    button:active{transform:translateY(1px)}
    .dimmed{opacity:0.1;pointer-events:none}
    .label{pointer-events:none;fill:#333;font-size:9px}
  </style>
</head>
<body>
  <div id="controls">
    <button id="toggleView">Macro view</button>
    <div id="legend"></div>
  </div>
  <svg></svg>

<script>
const FILE = "nodes_parent_name.jsonl";   // generated data file
let isMacro = false;
let macroGraph, microGraph;

const colour = id => id.startsWith("Person") ? "#f97316"  // orange
                : id.startsWith("Child")  ? "#3b82f6"  // blue
                :                            "#16a34a"; // green

const svg  = d3.select("svg");
const g    = svg.append("g");           // zoom container
const linkG = g.append("g");
const nodeG = g.append("g");
const labelG= g.append("g");

const zoom = d3.zoom().scaleExtent([0.1,4]).on("zoom", (e)=>g.attr("transform", e.transform));
svg.call(zoom).call(zoom.transform, d3.zoomIdentity.translate(window.innerWidth/2, window.innerHeight/2));

/* ------------------------------------------------------------------
   1. Load JSON‑Lines & build micro‑level graph
------------------------------------------------------------------ */
d3.text(FILE).then(text=>{
  const lines = text.trim().split(/\n+/).map(JSON.parse);
  const nodesById = new Map();
  const edges = [];
  lines.forEach(({parent,name})=>{
    if(!nodesById.has(name)) nodesById.set(name,{id:name});
    if(parent!==null){
      if(!nodesById.has(parent)) nodesById.set(parent,{id:parent});
      edges.push({source:parent,target:name});
    }
  });
  microGraph = {nodes:[...nodesById.values()], links:edges};
  macroGraph = buildMacroGraph(microGraph);
  initLegend();
  draw(microGraph);
});

/* ------------------------------------------------------------------
   2. Make macro graph: roots only + edges weighted by shared children
------------------------------------------------------------------ */
function buildMacroGraph({nodes,links}){
  const roots = nodes.filter(n=>n.id.startsWith("Person"));
  const rootIdx = new Map(roots.map(r=>[r.id,r]));
  // map root -> set of children
  const childrenByRoot = new Map(roots.map(r=>[r.id,new Set()]));
  links.forEach(l=>{
    if(rootIdx.has(l.source) && l.target.startsWith("Child")){
      childrenByRoot.get(l.source).add(l.target);
    }
  });
  const macroLinks = [];
  for(let i=0;i<roots.length;i++){
    for(let j=i+1;j<roots.length;j++){
      const a=roots[i].id,b=roots[j].id;
      const inter = intersection(childrenByRoot.get(a),childrenByRoot.get(b)).size;
      if(inter>0) macroLinks.push({source:a,target:b,value:inter});
    }
  }
  // size roots by number of children
  roots.forEach(r=>r.size=childrenByRoot.get(r.id).size);
  return {nodes:roots, links:macroLinks};
}
function intersection(a,b){let n=0; for(const x of a) if(b.has(x)) n++; return {size:n};}

/* ------------------------------------------------------------------
   3. Draw graph with D3 force simulation
------------------------------------------------------------------ */
let simulation;
function draw({nodes,links}){
  if(simulation) simulation.stop();
  simulation = d3.forceSimulation(nodes)
      .force("link", d3.forceLink(links).id(d=>d.id).distance(isMacro?120:60))
      .force("charge", d3.forceManyBody().strength(-150))
      .force("center", d3.forceCenter(0,0));

  /* ---- LINKS ---- */
  const linkSel = linkG.selectAll("line").data(links, d=>d.source+"->"+d.target);
  linkSel.exit().remove();
  linkSel.enter().append("line")
      .attr("stroke","#999").attr("stroke-opacity",0.6)
      .attr("stroke-width", d=> isMacro? Math.sqrt(d.value||1):1)
    .merge(linkSel);

  /* ---- NODES ---- */
  const nodeSel = nodeG.selectAll("circle").data(nodes, d=>d.id);
  nodeSel.exit().remove();
  nodeSel.enter().append("circle")
      .attr("r",d=>isMacro? 6+ (d.size||0):4)
      .attr("fill",d=>colour(d.id))
      .on("click", (event,d)=> focusNode(d))
      .call(d3.drag()
            .on("start", dragstarted)
            .on("drag", dragged)
            .on("end", dragended))
    .merge(nodeSel);

  /* ---- LABELS ---- */
  const labelSel = labelG.selectAll("text").data(nodes, d=>d.id);
  labelSel.exit().remove();
  labelSel.enter().append("text")
      .attr("class","label")
      .text(d=>d.id)
    .merge(labelSel);

  simulation.on("tick", ()=>{
    linkG.selectAll("line")
      .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
      .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeG.selectAll("circle")
      .attr("cx",d=>d.x).attr("cy",d=>d.y);
    labelG.selectAll("text")
      .attr("x",d=>d.x+6).attr("y",d=>d.y+3);
  });
}
function dragstarted(event,d){if(!event.active) simulation.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y;}
function dragged(event,d){d.fx=event.x; d.fy=event.y;}
function dragended(event,d){if(!event.active) simulation.alphaTarget(0); d.fx=null; d.fy=null;}

/* ------------------------------------------------------------------
   4. Focus / unfocus neighbourhood (micro view helper)
------------------------------------------------------------------ */
function focusNode(node){
  if(nodeG.select("circle.focus").node()===this){clearFocus();return;} // toggle off
  clearFocus();
  const neighbours = new Set();
  simulation.force("link").links().forEach(l=>{
    if(l.source.id===node.id){neighbours.add(l.target.id);} 
    else if(l.target.id===node.id){neighbours.add(l.source.id);} });
  nodeG.selectAll("circle").classed("dimmed", d=> d.id!==node.id && !neighbours.has(d.id));
  linkG.selectAll("line").classed("dimmed", l=> l.source.id!==node.id && l.target.id!==node.id);
  labelG.selectAll("text").classed("dimmed", d=> d.id!==node.id && !neighbours.has(d.id));
}
function clearFocus(){
  nodeG.selectAll("circle, text, line").classed("dimmed",false);
}

/* ------------------------------------------------------------------
   5. Legend & controls
------------------------------------------------------------------ */
function initLegend(){
  const items=[
    {color:"#f97316",label:"Roots (Person)"},
    {color:"#3b82f6",label:"Children"},
    {color:"#16a34a",label:"Grandchildren"}
  ];
  const leg=d3.select("#legend").selectAll("div").data(items).enter().append("div")
    .style("background",d=>d.color).attr("title",d=>d.label);
}

d3.select("#toggleView").on("click",()=>{
  isMacro=!isMacro;
  d3.select("#toggleView").text(isMacro?"Micro view":"Macro view");
  draw(isMacro?macroGraph:microGraph);
});
</script>
</body>
</html>
